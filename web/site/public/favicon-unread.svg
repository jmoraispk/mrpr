<!-- The same hat, wearing the unread dot. The dot sits over the crown's corner
     with a tile-coloured ring, so it still separates at 16px. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Mr. PR, with unread reviews</title>
  <rect width="64" height="64" rx="14" fill="#12161F"/>
  <rect x="18" y="9" width="28" height="31" rx="3" fill="#F4F4F0"/>
  <rect x="18" y="26" width="28" height="13" fill="#C2410C"/>
  <rect x="10" y="39" width="44" height="7" rx="3.5" fill="#F4F4F0"/>
  <circle cx="50" cy="14" r="12" fill="#C2410C" stroke="#12161F" stroke-width="5"/>
</svg>
