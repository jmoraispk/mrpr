name: site

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Sign-in tokens live in the origin's localStorage, so the site must
      # have an origin nothing else uses. Checked before anything is built.
      - name: The site needs an origin of its own
        run: node web/scripts/check-site-origin.mjs
        env:
          DELTA_SITE_ORIGIN: ${{ vars.DELTA_SITE_ORIGIN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # The client id is public under PKCE; a repository variable, not a secret.
      - run: npm run build:site
        working-directory: web
        env:
          # A dedicated origin serves the site from its root.
          DELTA_SITE_BASE: /
          VITE_GITLAB_HOST: ${{ vars.DELTA_GITLAB_HOST }}
          VITE_GITLAB_CLIENT_ID: ${{ vars.DELTA_GITLAB_CLIENT_ID }}
      - name: The site must not bundle the extension polyfill
        run: |
          if grep -rl "only be loaded in a browser extension" web/dist-site; then
            echo "::error::A shared module imports webextension-polyfill; the site would crash on load."
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
